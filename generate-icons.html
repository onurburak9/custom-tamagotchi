<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h2>Stachie Icon Generator</h2>
    <canvas id="icon192" width="192" height="192"></canvas>
    <canvas id="icon512" width="512" height="512"></canvas>
    <br>
    <button onclick="downloadIcons()">Download Icons</button>
    
    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const scale = size / 192;
            
            ctx.fillStyle = '#FFE5F1';
            ctx.fillRect(0, 0, size, size);
            
            ctx.save();
            ctx.scale(scale, scale);
            
            const centerX = 96;
            const centerY = 96;
            
            ctx.fillStyle = '#808080';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 15, 50, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(centerX, centerY - 15, 35, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#696969';
            ctx.beginPath();
            ctx.moveTo(centerX - 25, centerY - 40);
            ctx.lineTo(centerX - 15, centerY - 15);
            ctx.lineTo(centerX - 35, centerY - 15);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(centerX + 25, centerY - 40);
            ctx.lineTo(centerX + 15, centerY - 15);
            ctx.lineTo(centerX + 35, centerY - 15);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(centerX - 8, centerY - 15, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX + 8, centerY - 15, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 5);
            ctx.lineTo(centerX - 3, centerY);
            ctx.lineTo(centerX + 3, centerY);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#696969';
            ctx.fillRect(centerX - 6, centerY + 2, 12, 3);
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY + 8, 6, 0, Math.PI);
            ctx.stroke();
            
            ctx.restore();
        }
        
        drawIcon(document.getElementById('icon192'));
        drawIcon(document.getElementById('icon512'));
        
        function downloadIcons() {
            const link192 = document.createElement('a');
            link192.download = 'icon-192x192.png';
            link192.href = document.getElementById('icon192').toDataURL();
            link192.click();
            
            setTimeout(() => {
                const link512 = document.createElement('a');
                link512.download = 'icon-512x512.png';
                link512.href = document.getElementById('icon512').toDataURL();
                link512.click();
            }, 500);
        }
    </script>
</body>
</html>
