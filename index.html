<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFE5F1">
    <title>Stachie's World</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="status-bar">
            <div class="stat-item">
                <span class="stat-icon">🍽️</span>
                <div class="stat-bar">
                    <div class="stat-fill hunger-fill" id="hungerBar"></div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🧼</span>
                <div class="stat-bar">
                    <div class="stat-fill hygiene-fill" id="hygieneBar"></div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">😴</span>
                <div class="stat-bar">
                    <div class="stat-fill energy-fill" id="energyBar"></div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">❤️</span>
                <div class="stat-bar">
                    <div class="stat-fill health-fill" id="healthBar"></div>
                </div>
            </div>
        </div>

        <div class="pet-area">
            <div class="pet-container">
                <canvas id="petCanvas" width="300" height="300"></canvas>
                <div class="thought-bubble" id="thoughtBubble"></div>
            </div>
            <div class="environment">
                <div class="litter-box" id="litterBox"></div>
                <div class="food-bowl" id="foodBowl"></div>
                <div class="waste-indicator" id="wasteIndicator"></div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="feedBtn" data-action="feed">
                <span class="btn-icon">🍖</span>
                <span class="btn-text">Feed</span>
            </button>
            <button class="action-btn" id="cleanBtn" data-action="clean">
                <span class="btn-icon">🧹</span>
                <span class="btn-text">Clean</span>
            </button>
            <button class="action-btn" id="sleepBtn" data-action="sleep">
                <span class="btn-icon">🛏️</span>
                <span class="btn-text">Sleep</span>
            </button>
            <button class="action-btn" id="playBtn" data-action="play">
                <span class="btn-icon">🧶</span>
                <span class="btn-text">Play</span>
            </button>
            <button class="action-btn" id="medicineBtn" data-action="medicine">
                <span class="btn-icon">💊</span>
                <span class="btn-text">Medicine</span>
            </button>
            <button class="action-btn" id="litterBtn" data-action="litter">
                <span class="btn-icon">🚽</span>
                <span class="btn-text">Litter</span>
            </button>
        </div>

        <div class="info-panel">
            <div class="pet-name">Stachie</div>
            <div class="pet-age">Age: 10 years</div>
            <div class="pet-mood" id="moodDisplay">Mood: Content</div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="script.js"></script>
</body>
</html>
